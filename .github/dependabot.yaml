version: 2

updates:
  - directory: "/"
    package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - directory: "/"
    package-ecosystem: "pre-commit"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
