name: PR Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    # Add permissions for OIDC token
    permissions:
      id-token: write
      contents: read

    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install shfmt
        # Resolve the asset with jq rather than a regex over the JSON. POSIX ERE
        # leaves stacked quantifiers undefined, so `.+?` is not lazy: it reads as
        # a greedy `.+` followed by an optional `?` and matches from the first
        # "https://" in the payload to the last "linux_amd64", about 7KB of JSON.
        run: |
          url=$(curl -fsSL https://api.github.com/repos/mvdan/sh/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("_linux_amd64")) | .browser_download_url')
          curl -fsSL -o shfmt "$url"
          chmod +x shfmt && sudo mv shfmt /usr/bin/
          shfmt --version

      - name: Install shellcheck
        run: |
          sudo apt update && sudo apt install shellcheck

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
